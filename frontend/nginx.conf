server {
    listen 80;
    server_name localhost;

    # Docker's embedded DNS. Resolving the backend per request (via the
    # variable below) lets nginx start even if the backend is down and keeps
    # working after the backend container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Django backend container (path is passed as-is)
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
