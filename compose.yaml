name: netguard

include:
  - path: infrastructure/kafka/compose.yaml

# Core platform: kafka (+ kafka-init), postgres, migrate, backend, frontend.
# All services share the `netguard` network (declared in the included Kafka
# file), so containers reach each other by service name:
#   kafka:9092, postgres:5432, backend:8000, frontend:80
# Future modules (e.g. analysis) are added below in the same way; the
# pcap-importer is opt-in via the "importer" profile.

services:

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - netguard

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

      kafka:
        condition: service_healthy

      kafka-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    networks:
      - netguard

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - netguard

  migrate:
    build: ./backend
    command: python manage.py migrate --noinput

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - netguard

    restart: "no"

  # PCAP / flow-dataset importer (modules/pcap-importer). A batch job, not a
  # long-running service: it sits behind the "importer" profile so a plain
  # `docker compose up` does not re-import (and re-publish) the same captures.
  #   docker compose run --rm pcap-importer                   # every file in ./data/pcap-input
  #   docker compose run --rm pcap-importer pcap /data/input/x.pcapng
  #   docker compose run --rm pcap-importer list
  pcap-importer:
    build:
      context: ./modules/pcap-importer
      additional_contexts:
        contracts: ./contracts/kafka
    profiles: ["importer"]

    environment:
      NETGUARD_INGEST_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NETGUARD_INGEST_KAFKA_TOPIC: flows.normalized

    volumes:
      - ./data/pcap-input:/data/input:ro
      - ingestion_output:/data/output

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    networks:
      - netguard

    restart: "no"

volumes:
  postgres_data:
  ingestion_output:
